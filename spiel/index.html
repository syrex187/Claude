<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Kiko</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a1a;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #2a1e3e,0 10px 50px #000a}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;
    color:#fff;font:bold 20px/1 monospace;display:flex;align-items:center;justify-content:center;
    width:68px;height:68px;backdrop-filter:blur(2px)}
  .tb.act{background:#ffffff55}
  #tl{left:18px;bottom:22px}#tr{left:100px;bottom:22px}
  #ta{right:18px;bottom:30px;width:78px;height:78px;background:#3fb83a44}
  #tf{right:108px;bottom:18px;background:#ff8a2a44}
  #tp{right:14px;top:14px;width:44px;height:44px;font-size:14px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="400" height="224"></canvas></div>
<div id="touch">
  <div class="tb" id="tl" data-a="left">◀</div>
  <div class="tb" id="tr" data-a="right">▶</div>
  <div class="tb" id="tf" data-a="shoot">B</div>
  <div class="tb" id="ta" data-a="jump">A</div>
  <div class="tb" id="tp" data-a="pause">II</div>
</div>
<script>
'use strict';
/* =====================================================================
   PIXEL KIKO – Die Kristall-Jagd
   Ein 2D-Pixel-Jump'n'Run. Alles in dieser einen Datei.

   Aufbau (such nach "🔧 ERWEITERUNG" für Stellen, an denen du leicht
   Neues einbauen kannst):
     1. Konfiguration & Hilfsfunktionen
     2. Pixel-Schrift
     3. Eingabe (Tastatur + Touch)
     4. Sound & Musik (alles live erzeugt, keine Dateien)
     5. Speicherstand
     6. Outfits (Skins)
     7. Themen (Welt-Looks)
     8. Items / Power-Ups
     9. Gegner
    10. Endbosse
    11. Level-Karten
    12. Level laden, Physik, Spiel-Logik
    13. Zeichnen
    14. Bildschirme (Titel, Karte, Pause, Sieg ...)
    15. Hauptschleife
   ===================================================================== */

// ============ 1. KONFIGURATION & HILFSFUNKTIONEN ============
const VW = 400, VH = 224, T = 16, ROWS = 14;
const FLOOR_Y = 12 * T;                  // Boden in Boss-Arenen
const ARENA_W = 25;                      // Arena = letzte 25 Spalten jedes Levels
const PHYS = {
  grav: 0.42, gravHold: 0.22, maxFall: 7,
  jump: -5.4, doubleJump: -4.8, spring: -9.6,
  run: 2.3, accel: 0.4, airAccel: 0.28,
  iceAccel: 0.09, iceFric: 0.985, fric: 0.72,
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const sign = v => v < 0 ? -1 : 1;
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function P(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }

// Zeichnet eine Figur mit dunkler Pixel-Umrandung (macht den Retro-Look)
const [SCR, sx] = mk(200, 200), [SIL, sl] = mk(200, 200);
function drawOutlined(x, y, w, h, fn, o = {}) {
  const s = o.scale || 1; w += 2; h += 2;
  sx.clearRect(0, 0, w, h); fn(sx, 1, 1);
  sl.clearRect(0, 0, w, h); sl.globalCompositeOperation = 'source-over'; sl.drawImage(SCR, 0, 0);
  sl.globalCompositeOperation = 'source-in'; P(sl, 0, 0, w, h, o.outline || '#140c1c');
  sl.globalCompositeOperation = 'source-over';
  const X = Math.round(x) - s, Y = Math.round(y) - s, W = w * s, H = h * s;
  ctx.drawImage(SIL, 0, 0, w, h, X - s, Y, W, H); ctx.drawImage(SIL, 0, 0, w, h, X + s, Y, W, H);
  ctx.drawImage(SIL, 0, 0, w, h, X, Y - s, W, H); ctx.drawImage(SIL, 0, 0, w, h, X, Y + s, W, H);
  if (o.flash) { sl.globalCompositeOperation = 'source-in'; P(sl, 0, 0, w, h, o.flash); sl.globalCompositeOperation = 'source-over'; ctx.drawImage(SIL, 0, 0, w, h, X, Y, W, H); }
  else ctx.drawImage(SCR, 0, 0, w, h, X, Y, W, H);
}
// Rechteck-Helfer, der eine nach rechts schauende Figur spiegeln kann
function mirror(c, ox, oy, W, dir) { return (dx, dy, w, h, col) => { c.fillStyle = col; c.fillRect(dir > 0 ? ox + dx : ox + W - dx - w, oy + dy, w, h); }; }

// ============ 2. PIXEL-SCHRIFT (5x7) ============
const FONT_HEX = {
  A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',
  G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020202120C',K:'11121418141211',L:'1010101010101F',
  M:'111B1515111111',N:'11111915131111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',
  S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',
  Y:'11110A04040404',Z:'1F01020408101F','0':'0E11131519110E','1':'040C040404040E','2':'0E11010204081F',
  '3':'1F02040201110E','4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808',
  '8':'0E11110E11110E','9':'0E11110F01020C','Ä':'0A000E111F1111','Ö':'0A000E1111110E','Ü':'0A00111111110E',
  ' ':'00000000000000','.':'00000000000C0C',',':'000000000C0408','!':'04040404040004','?':'0E110102040004',
  ':':'000C0C000C0C00','-':'0000001F000000','+':'0004041F040400','/':'01010204081010',"'":'04040800000000',
  '(':'02040808080402',')':'08040202020408','>':'08040201020408','<':'02040810080402','♥':'000A1F1F0E0400',
  '%':'18190204081303','=':'00001F001F0000','*':'0004150E150400','◆':'040E1F1F0E0400','◇':'040A11110A0400',
  '◀':'02060E1E0E0602','▶':'080C0E0F0E0C08','_':'0000000000001F','#':'0A0A1F0A1F0A0A','&':'0C12140815120D',
};
const FONT = {};
for (const k in FONT_HEX) { FONT[k] = []; for (let i = 0; i < 7; i++) FONT[k].push(parseInt(FONT_HEX[k].substr(i * 2, 2), 16)); }
function drawStr(s, x, y, col, sc) {
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let r = 0; r < 7; r++) { const b = g[r]; if (!b) continue;
      for (let k = 0; k < 5; k++) if (b & (16 >> k)) ctx.fillRect(x + (i * 6 + k) * sc, y + r * sc, sc, sc); }
  }
}
function textW(s, sc = 1) { return String(s).toUpperCase().length * 6 * sc - sc; }
function text(s, x, y, col = '#fff', sc = 1, align = 'left', shadow = '#140c1c') {
  s = String(s).toUpperCase(); const w = s.length * 6 * sc - sc;
  if (align === 'center') x -= Math.floor(w / 2); else if (align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (shadow) drawStr(s, x + sc, y + sc, shadow, sc);
  drawStr(s, x, y, col, sc);
}

// ============ 3. EINGABE ============
const Input = {
  down: {}, pressed: {},
  map: { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
         Space:'jump', KeyZ:'jump', KeyK:'jump', KeyY:'jump', KeyX:'shoot', KeyJ:'shoot', ShiftLeft:'shoot', ShiftRight:'shoot',
         Enter:'start', Escape:'pause', KeyP:'pause', KeyM:'mute' },
  set(a, v) { if (v && !this.down[a]) this.pressed[a] = true; this.down[a] = v; },
  hit(a) { return !!this.pressed[a]; },
  ok() { return this.hit('start') || this.hit('jump'); },
  clear() { this.pressed = {}; },
};
addEventListener('keydown', e => { const a = Input.map[e.code]; if (a) { e.preventDefault(); if (!e.repeat) Input.set(a, true); } Sound.unlock(); });
addEventListener('keyup', e => { const a = Input.map[e.code]; if (a) { e.preventDefault(); Input.set(a, false); } });
addEventListener('blur', () => { Input.down = {}; });
// Touch-Steuerung
const touchEl = document.getElementById('touch');
function enableTouch() { touchEl.classList.add('on'); }
addEventListener('touchstart', () => { enableTouch(); Sound.unlock(); }, { passive: true });
document.querySelectorAll('.tb').forEach(b => {
  const a = b.dataset.a;
  const on = e => { e.preventDefault(); Sound.unlock(); Input.set(a, true); if (a === 'jump') Input.set('start', true); b.classList.add('act'); };
  const off = e => { e.preventDefault(); Input.set(a, false); if (a === 'jump') Input.set('start', false); b.classList.remove('act'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cvs.addEventListener('pointerdown', () => { Sound.unlock(); if (G.state !== 'play') Input.set('start', true); });
cvs.addEventListener('pointerup', () => Input.set('start', false));

// ============ 4. SOUND & MUSIK ============
const Sound = (() => {
  let ac = null, master, sfxG, musG, noiseBuf, muted = false;
  function unlock() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
        sfxG = ac.createGain(); sfxG.gain.value = 0.6; sfxG.connect(master);
        musG = ac.createGain(); musG.gain.value = 0.24; musG.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextTime = ac.currentTime + 0.05;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(type, f0, f1, dur, vol, t0, dest) {
    if (!ac) return; const t = t0 ?? ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol * 0.3, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, t0, freq = 1000, dest, type = 'bandpass') {
    if (!ac) return; const t = t0 ?? ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.setValueAtTime(vol * 0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || sfxG); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  const now = () => ac ? ac.currentTime : 0;
  // 🔧 ERWEITERUNG: neue Soundeffekte hier eintragen und mit Sound.sfx('name') abspielen
  const SFX = {
    jump()   { tone('square', 280, 560, 0.12, 0.5); },
    djump()  { tone('square', 420, 900, 0.12, 0.45); tone('triangle', 600, 1200, 0.1, 0.4); },
    coin()   { const t = now(); tone('square', 988, null, 0.07, 0.4, t); tone('square', 1319, null, 0.22, 0.4, t + 0.07); },
    stomp()  { tone('square', 220, 70, 0.14, 0.6); noise(0.08, 0.6, null, 600); },
    kick()   { tone('square', 500, 120, 0.1, 0.5); },
    hurt()   { tone('sawtooth', 440, 90, 0.35, 0.6); },
    power()  { const t = now(); [523, 659, 784, 1047, 1319].forEach((f, i) => tone('square', f, null, 0.09, 0.4, t + i * 0.06)); },
    oneup()  { const t = now(); [659, 784, 1319, 1047, 1175, 1568].forEach((f, i) => tone('square', f, null, 0.1, 0.4, t + i * 0.08)); },
    fire()   { tone('square', 900, 250, 0.1, 0.35); noise(0.06, 0.3, null, 3000); },
    bump()   { tone('triangle', 160, 90, 0.1, 0.7); },
    brk()    { noise(0.2, 0.9, null, 900); tone('square', 180, 60, 0.12, 0.4); },
    box()    { tone('square', 330, 660, 0.08, 0.4); },
    spring() { tone('triangle', 200, 900, 0.25, 0.7); },
    check()  { const t = now(); [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, null, 0.15, 0.5, t + i * 0.07)); },
    klonk()  { tone('square', 1200, 800, 0.06, 0.4); tone('triangle', 300, 200, 0.1, 0.5); },
    bossHit(){ tone('square', 180, 60, 0.25, 0.7); noise(0.2, 0.8, null, 500); },
    boom()   { noise(0.6, 1, null, 300, null, 'lowpass'); tone('sine', 120, 30, 0.5, 0.9); },
    roar()   { tone('sawtooth', 160, 60, 0.8, 0.6); noise(0.8, 0.5, null, 400); },
    shoot()  { tone('square', 600, 200, 0.12, 0.3); },
    die()    { const t = now(); [494, 466, 440, 392, 349, 294].forEach((f, i) => tone('square', f, null, 0.14, 0.45, t + i * 0.12)); },
    select() { tone('square', 660, null, 0.05, 0.35); },
    confirm(){ const t = now(); tone('square', 660, null, 0.06, 0.4, t); tone('square', 990, null, 0.1, 0.4, t + 0.06); },
    pause()  { const t = now(); tone('square', 988, null, 0.06, 0.4, t); tone('square', 659, null, 0.08, 0.4, t + 0.07); },
    fanfare(){ const t = now(); [[523,0],[659,.12],[784,.24],[1047,.36],[784,.56],[1047,.68]].forEach(([f, d], i) => { tone('square', f, null, i === 5 ? 0.6 : 0.16, 0.45, t + d); tone('triangle', f / 2, null, i === 5 ? 0.6 : 0.16, 0.5, t + d); }); },
  };
  // --- Musik: Mini-Sequenzer. Jede Zeichengruppe = Achtelnote, '-' = halten, '.' = Pause
  // 🔧 ERWEITERUNG: eigene Songs hier hinzufügen und im Thema mit music:'name' verwenden
  const SONGS = {
    title: { bpm: 120, mel: 'C5 E5 G5 E5 C6 - B5 G5 A5 - F5 A5 G5 - - . F5 A5 C6 A5 G5 - E5 C5 D5 E5 F5 D5 C5 - - .',
             bass: 'C3 . C3 . E3 . E3 . F3 . F3 . G3 . G3 . F3 . F3 . C3 . C3 . G2 . G2 . C3 . C3 .', drum: 'k...h...s...h...' },
    forest:{ bpm: 150, mel: 'E5 G5 C6 G5 A5 - G5 E5 F5 A5 G5 E5 D5 - - . E5 G5 C6 G5 A5 - C6 D6 E6 D6 C6 A5 G5 - - . A5 - G5 E5 F5 - E5 C5 D5 E5 F5 G5 E5 - - . A5 - G5 E5 F5 - A5 B5 C6 - G5 - C6 - - .',
             bass: 'C3 . G3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G3 . A2 . E3 . F2 . G2 . C3 . G2 . F2 . C3 . F2 . C3 . G2 . G2 . C3 . F2 . C3 . F2 . A2 . G2 . G2 . C3 . C3 .', drum: 'k.h.s.h.k.k.s.hh' },
    cave:  { bpm: 112, mel: 'A4 . C5 E5 D5 . C5 B4 A4 . E4 . G4 A4 . . F4 . A4 C5 B4 . G4 E4 A4 - - - . . . . E5 . D5 C5 B4 . C5 D5 E5 . A4 . B4 C5 . . D5 . C5 B4 G#4 . B4 D5 C5 - B4 - A4 - - .',
             bass: 'A2 . . A2 E3 . . . F2 . . F2 C3 . . . D2 . . D2 A2 . . . E2 . . E2 G#2 . E2 .', drum: 'k...h.h.s...h...' },
    ice:   { bpm: 136, mel: 'F#5 A5 D6 A5 F#5 . E5 F#5 G5 B5 A5 F#5 E5 - . . D5 F#5 A5 D6 C#6 . B5 A5 G5 F#5 E5 C#5 D5 - - . B5 - A5 F#5 G5 - F#5 D5 E5 - C#5 E5 A5 - - . B5 - D6 B5 A5 - F#5 A5 G5 F#5 E5 C#5 D5 - - .',
             bass: 'D3 . A3 . G2 . D3 . B2 . F#3 . A2 . E3 . D3 . A3 . G2 . D3 . A2 . A2 . D3 . . .', drum: 'k.h.s.h.k.h.s.h.' },
    lava:  { bpm: 160, mel: 'E4 E4 G4 E4 A4 E4 B4 A4 G4 E4 D4 E4 . E4 G4 B4 C5 B4 A4 G4 A4 B4 G4 E4 F#4 G4 F#4 D4 E4 - . . B4 B4 C5 B4 A4 G4 A4 B4 C5 B4 A4 G4 F#4 - E4 - E5 D5 C5 B4 A4 G4 F#4 G4 A4 G4 F#4 D#4 E4 - - .',
             bass: 'E2 E2 . E2 E3 . E2 . C2 C2 . C2 C3 . D2 . E2 E2 . E2 E3 . E2 . B1 B1 . B1 D#2 . B1 .', drum: 'k.hks.h.k.hks.hs' },
    boss:  { bpm: 172, mel: 'E4 F4 E4 D#4 E4 . B4 . C5 B4 A#4 B4 . . E4 . E4 F4 E4 D#4 E4 . G4 . A#4 A4 G#4 A4 B4 - - . E5 D#5 E5 . B4 . C5 . D5 C5 B4 . A4 . G4 . F#4 G4 A4 . B4 . E4 . F#4 G4 F#4 D#4 E4 - - .',
             bass: 'E2 E3 E2 E3 E2 E3 E2 E3 F2 F3 F2 F3 F2 F3 F2 F3 G2 G3 G2 G3 A2 A3 A2 A3 B1 B2 B1 B2 B1 B2 D#2 B1', drum: 'k.skk.s.k.skk.ss' },
    map:   { bpm: 104, mel: 'G4 . C5 . E5 . D5 C5 D5 - - . G4 . B4 . D5 . C5 B4 C5 - - . . . E5 . F5 . G5 . A5 G5 F5 E5 D5 . C5 . . . . .',
             bass: 'C3 . G2 . C3 . G2 . G2 . D3 . G2 . D3 . A2 . E3 . F2 . C3 . G2 . G2 . C3 . . .', drum: 'k...h...k...h...' },
  };
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(n) { const m = n.match(/^([A-G])(#?)(\d)$/); if (!m) return 0; const midi = 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (midi - 69) / 12); }
  for (const k in SONGS) { const s = SONGS[k]; s.m = s.mel.split(/\s+/); s.b = s.bass.split(/\s+/); s.d = s.drum.split(''); s.spb = 60 / s.bpm / 2; }
  let song = null, step = 0, nextTime = 0, songName = '';
  function lenFrom(arr, i) { let n = 1; while (arr[(i + n) % arr.length] === '-' && n < 16) n++; return n; }
  function schedule(s, i, t) {
    const mi = i % s.m.length, mt = s.m[mi];
    if (mt !== '.' && mt !== '-') { const f = freq(mt); if (f) { const d = lenFrom(s.m, mi) * s.spb * 0.92; tone('square', f, null, d, 0.55, t, musG); tone('square', f * 1.005, null, d, 0.18, t, musG); } }
    const bi = i % s.b.length, bt = s.b[bi];
    if (bt !== '.' && bt !== '-') { const f = freq(bt); if (f) tone('triangle', f, null, lenFrom(s.b, bi) * s.spb * 0.95, 1.1, t, musG); }
    const dt = s.d[i % s.d.length];
    if (dt === 'k') tone('sine', 150, 40, 0.12, 1.2, t, musG);
    else if (dt === 's') noise(0.1, 0.7, t, 1800, musG);
    else if (dt === 'h') noise(0.03, 0.35, t, 7000, musG, 'highpass');
  }
  setInterval(() => {
    if (!ac || !song || muted) return;
    if (nextTime < ac.currentTime - 0.3) nextTime = ac.currentTime + 0.05;
    while (nextTime < ac.currentTime + 0.18) { schedule(song, step, nextTime); nextTime += song.spb; step++; }
  }, 40);
  return {
    unlock,
    sfx(n) { if (!muted && ac && SFX[n]) SFX[n](); },
    play(n) { if (songName === n) return; songName = n; song = SONGS[n] || null; step = 0; if (ac) nextTime = ac.currentTime + 0.08; },
    stop() { song = null; songName = ''; },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; return muted; },
    setMuted(m) { muted = m; if (master) master.gain.value = muted ? 0 : 0.55; },
    get muted() { return muted; },
  };
})();

// ============ 5. SPEICHERSTAND ============
const SAVE_KEY = 'pixelkiko_save_v1';
const SAVE = { unlocked: 1, gems: {}, best: {}, skin: 0, muted: false, beaten: false };

// Jeder Boss hat Name, Lebenspunkte und eine kleine Zustandsmaschine (state) in update().
// canStomp(b) sagt, ob ein Sprung auf den Kopf gerade Schaden macht.
// 🔧 ERWEITERUNG: neuer Boss = Eintrag hier + im Level boss:'name'.
const BOSSES = {
  slimeKing: {
    name: 'KÖNIG GLIBBER', title: 'HERRSCHER DES WALDES', hp: 10, w: 40, h: 30, stompDmg: 2,
    init(b) { b.y = -70; b.state = 'intro'; b.hops = 0; b.squash = 0; },
    update(b) {
      const p = G.p, r = bossPhysics(b);
      if (r.landed) { b.squash = 10; shake(6); Sound.sfx('bump'); dust(b.x + b.w / 2, b.y + b.h, 10);
        if (b.state === 'intro' || b.state === 'hop') { b.state = 'land'; b.timer = 0; b.vx = 0; } }
      if (b.squash > 0) b.squash--;
      if (r.wall) b.vx = -b.vx * 0.5;
      switch (b.state) {
        case 'intro': break;
        case 'land': b.vx = 0; if (b.timer > 8) setState(b, 'idle'); break;
        case 'idle':
          b.vx = 0; b.dir = sign(p.x - b.x);
          if (b.timer > (b.p2 ? 22 : 42)) {
            if (b.hops >= 3) { setState(b, 'spit'); b.hops = 0; }
            else { setState(b, 'hop'); b.vy = b.p2 ? -8.2 : -7; b.vx = clamp((p.x - b.x) / 42, -2.8, 2.8); b.hops++; Sound.sfx('jump'); }
          } break;
        case 'spit':
          if (b.timer === 30) {
            const n = b.p2 ? 3 : 2; Sound.sfx('shoot');
            for (let i = 0; i < n; i++) if (G.enemies.filter(e => e.mini && !e.dead).length < 5)
              spawnEnemy('slime', b.x + b.w / 2 - 5, b.y + 4, { mini: true, vx: (i - (n - 1) / 2) * 2.2 + b.dir * 0.5, vy: -4.5, thrown: true, dir: i % 2 ? 1 : -1, active: true });

/* Legende (Buchstaben in den Karten):
   #  Boden         B  Ziegel (zerbrechlich)   ?  Münz-Kiste     !  Power-Kiste
   h  Herz-Kiste    f  Feuer-Kiste             s  Stern-Kiste    w  Flügel-Kiste
   =  Brett (von unten durchspringbar)         ^  Stacheln       ~  Lava
   C  Bröckel-Block o  Münze   g  Kristall-Edelstein (3 pro Level, versteckt!)
   P  Start  K  Checkpoint  J  Sprungfeder  m  Plattform (waagerecht)  v  Plattform (senkrecht)
   e  Schleim  k  Stachelkäfer  b  Fledermaus  j  Frosch  t  Spuck-Blume  r  Feuer-Rotor
   X  Boss-Startpunkt (immer im Arena-Abschnitt am Ende)
   Jedes Level besteht aus Abschnitten (14 Zeilen). Zeilen die du weglässt sind leer.
   Eine Zeile, die mit '#' oder '~' endet, wird automatisch bis zum Abschnittsende verlängert. */
const GND = { 12: '#', 13: '#' };
const S = rows => Object.assign({}, GND, rows);
const CAVE = rows => Object.assign({ 0: '#', 1: '#' }, GND, rows);
function ARENA(rows, ceiling) {
  const out = {};
  for (let r = 0; r < ROWS; r++) {
    let s = rows[r] !== undefined ? rows[r] : (r >= 12 ? '#' : (ceiling && r < 2 ? '#' : ''));
    if (s === '#') s = '#'.repeat(ARENA_W); else s = s.padEnd(ARENA_W - 1, ' ').slice(0, ARENA_W - 1) + '#';
    out[r] = s;
  }
  return out;
}

const COMING_SOON = 1;

function buildMap(def) {
  const rows = Array.from({ length: ROWS }, () => '');
  for (const seg of def.segments.concat([def.arena])) {
    let w = 0; for (let r = 0; r < ROWS; r++) w = Math.max(w, (seg[r] || '').length);
    for (let r = 0; r < ROWS; r++) {
      let s = seg[r] || ''; const last = s[s.length - 1];
      const pad = (last === '#' || last === '~') ? last : ' ';
      rows[r] += s.padEnd(w, pad);
    }
  }
  return rows;
}

const SOLID = new Set(['#', 'B', '?', '!', 'h', 's', 'w', 'f', 'U', 'C', 'L']);
function tileAt(c, r) { const lv = G.lv; if (r < 0 || r >= ROWS) return ' '; if (c < 0 || c >= lv.w) return '#'; return lv.grid[r][c]; }
const isSolid = (c, r) => SOLID.has(tileAt(c, r));

function shade(hex, amt) {
  let n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
}

function loadLevel(i) {

      case 'v': G.objs.push({ type: 'plat', x, y, w: 48, h: 6, x0: x, y0: y, ax: 0, ay: -5 * T, sp: 0.014, ph: c * 0.7, dx: 0, dy: 0 }); break;
      case 'r': G.objs.push({ type: 'rotor', x: x + 8, y: y + 8, a: c * 0.5, n: 5, sp: 0.035 }); lv.grid[r][c] = 'U'; clear = false; break;
      case 'X': lv.bossSpawn = { x: x + 8, y: y + T }; break;
      default: clear = false;
    }
    if (clear) lv.grid[r][c] = ' ';
  }
  // Deko auf Bodenkanten (Gras, Blumen, Kristalle ...)
  for (let c = 0; c < lv.w; c++) for (let r = 1; r < ROWS; r++)
    if (lv.grid[r][c] === '#' && tileAt(c, r - 1) === ' ' && hash(c, r) < 0.35) lv.deco.push({ x: c * T + Math.floor(hash(r, c) * 10), y: r * T, k: Math.floor(hash(c * 3, r * 7) * 4) });
  G.checkpoint = { ...start };
  G.p = makePlayer(start.x, start.y);
  G.tiles = buildTiles(theme); G.bg = buildBG(theme); G.bgFor = theme.id;
  G.cam.x = 0; updateCamera(true);
  G.banner = { text: lv.def.name, sub: 'LEVEL ' + (i + 1), t: 150 };
  Sound.play(theme.music);
}

function makePlayer(x, y) {
  return { x, y, w: 10, h: 15, vx: 0, vy: 0, dir: 1, onGround: false, coyote: 0, jbuf: 0, airJumps: 0, hearts: 3, maxHearts: 3,
    inv: 0, star: 0, fire: false, wings: false, ride: null, t: 0, dying: 0, runT: 0, shootCd: 0, land: 0 };
}

function spawnEnemy(type, x, y, extra = {}) {
  const def = ENEMIES[type];
  const e = Object.assign({ type, def, x, y, w: def.w, h: def.h, vx: 0, vy: 0, dir: -1, t: 0, onGround: false, active: false, dead: false }, extra);
  def.init(e); Object.assign(e, extra.vx !== undefined ? { vx: extra.vx } : {});
  G.enemies.push(e); return e;
}

function moveBody(e) {
  const res = { wall: 0, ceil: null, ground: false, under: [] };
  e.x += e.vx;
  let top = Math.floor(e.y / T), bot = Math.floor((e.y + e.h - 0.01) / T);
  if (e.vx > 0) { const c = Math.floor((e.x + e.w - 0.01) / T); for (let r = top; r <= bot; r++) if (isSolid(c, r)) { e.x = c * T - e.w; e.vx = 0; res.wall = 1; break; } }
  else if (e.vx < 0) { const c = Math.floor(e.x / T); for (let r = top; r <= bot; r++) if (isSolid(c, r)) { e.x = (c + 1) * T; e.vx = 0; res.wall = -1; break; } }
  const prevBottom = e.y + e.h;
  e.y += e.vy; e.onGround = false;
  const l = Math.floor(e.x / T), rr = Math.floor((e.x + e.w - 0.01) / T);
  if (e.vy > 0) {
    const r = Math.floor((e.y + e.h - 0.01) / T);
    for (let c = l; c <= rr; c++) { const t = tileAt(c, r);
      if (SOLID.has(t) || (t === '=' && !e.noPlat && prevBottom <= r * T + 0.5)) { e.y = r * T - e.h; e.vy = 0; e.onGround = true; res.ground = true; break; } }
    if (res.ground) for (let c = l; c <= rr; c++) res.under.push([c, Math.floor((e.y + e.h) / T)]);
  } else if (e.vy < 0) {
    const r = Math.floor(e.y / T); let hit = false;
    for (let c = l; c <= rr; c++) if (isSolid(c, r)) hit = true;
    if (hit) { e.y = (r + 1) * T; e.vy = 0; const cc = Math.floor((e.x + e.w / 2) / T); res.ceil = isSolid(cc, r) ? [cc, r] : (isSolid(l, r) ? [l, r] : [rr, r]); }
  }
  return res;
}
function enemyPhysics(e) { if (e.def && e.def.fly) return { wall: 0 }; e.vy = Math.min(e.vy + 0.35, 7); return moveBody(e); }
function ledgeAhead(e) { const c = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / T), r = Math.floor((e.y + e.h + 2) / T); const t = tileAt(c, r); return !(SOLID.has(t) || t === '='); }
function bossPhysics(b) {
  b.timer++; b.t++;
  if (b.def.fly) return {};
  const was = b.onGround; b.vy = Math.min(b.vy + 0.4, 8);
  const r = moveBody(b); r.landed = r.ground && !was; return r;
}
function setState(b, s) { b.state = s; b.timer = 0; }

function part(x, y, vx, vy, col, life, sz = 2, grav = 0) { return { x, y, vx, vy, col, life, max: life, sz, grav }; }
function dust(x, y, n = 6, col = '#e8e0d0') { for (let i = 0; i < n; i++) G.parts.push(part(x + rand(-6, 6), y - 2, rand(-1.2, 1.2), rand(-1.4, -0.2), col, irand(14, 26), irand(1, 3), 0.04)); }
function burst(x, y, cols, n = 12, sp = 2.5) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), s = rand(0.5, sp); G.parts.push(part(x, y, Math.cos(a) * s, Math.sin(a) * s, cols[i % cols.length], irand(18, 36), irand(1, 3), 0.06)); } }
function popText(x, y, s, col = '#fff') { G.texts.push({ x, y, s: String(s), col, life: 50 }); }
function shake(n) { G.shakeT = Math.max(G.shakeT, n); }
function addScore(n, x, y) { G.score += n; if (x !== undefined) popText(x, y, n); }
function addCoin(x, y) {
  G.coins++; G.coinsLevel++; G.score += 50; Sound.sfx('coin');
  if (G.coins >= 100) { G.coins -= 100; G.lives++; Sound.sfx('oneup'); popText(G.p.x, G.p.y - 10, '1 UP!', '#7aff7a'); }
}

// ---- Spieler ----
function updatePlayer() {
  const p = G.p, th = G.lv.theme; p.t++;
  if (p.dying) {
    p.dying++; if (p.dying > 30) { p.vy += 0.3; p.y += p.vy; }
    if (p.dying > 130) afterDeath(); return;
  }
  const L = Input.down.left, Rt = Input.down.right, ice = th.slippery && p.onGround;
  const acc = p.onGround ? (ice ? PHYS.iceAccel : PHYS.accel) : PHYS.airAccel;
  if (L && !Rt) { p.vx -= acc * (p.vx > 0 && !ice ? 2 : 1); p.dir = -1; }
  else if (Rt && !L) { p.vx += acc * (p.vx < 0 && !ice ? 2 : 1); p.dir = 1; }
  else { p.vx *= p.onGround ? (ice ? PHYS.iceFric : PHYS.fric) : 0.94; if (Math.abs(p.vx) < 0.05) p.vx = 0; }
  p.vx = clamp(p.vx, -PHYS.run, PHYS.run);

  if (Input.hit('jump')) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  if (p.onGround) { p.coyote = 7; p.airJumps = p.wings ? 1 : 0; } else if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0 && p.coyote > 0) {
    p.vy = PHYS.jump; p.jbuf = 0; p.coyote = 0; p.onGround = false; p.ride = null; Sound.sfx('jump'); dust(p.x + 5, p.y + p.h, 4);
  } else if (Input.hit('jump') && p.coyote <= 0 && p.airJumps > 0) {
    p.airJumps--; p.vy = PHYS.doubleJump; p.jbuf = 0; Sound.sfx('djump'); burst(p.x + 5, p.y + p.h, ['#fff', '#d8ecff'], 8, 1.5);
  }
  const g = (p.vy < 0 && Input.down.jump) ? PHYS.gravHold : PHYS.grav;
  p.vy = Math.min(p.vy + g, PHYS.maxFall);

  // auf Plattform mitfahren
  if (p.ride) { p.x += p.ride.dx; p.y = p.ride.y - p.h; }
  const wasGround = p.onGround, prevBottom = p.y + p.h, prevVy = p.vy;
  const r = moveBody(p);
  // bewegte Plattformen
  p.ride = null;
  for (const o of G.objs) if (o.type === 'plat' && p.vy >= 0 && p.x + p.w > o.x && p.x < o.x + o.w && prevBottom <= o.y - o.dy + 2 && p.y + p.h >= o.y) {
    p.y = o.y - p.h; p.vy = 0; p.onGround = true; p.ride = o;
  }
  if (p.onGround && !wasGround && prevVy > 3) { dust(p.x + 5, p.y + p.h, 5); p.land = 6; }
  if (p.land > 0) p.land--;
  if (r.ceil) hitBlock(r.ceil[0], r.ceil[1]);
  for (const [c, rr] of r.under) if (tileAt(c, rr) === 'C') { const k = c + ',' + rr; if (!G.lv.crumbles.has(k)) G.lv.crumbles.set(k, { c, r: rr, t: 0, gone: false }); }

  // Feuerball
  if (p.shootCd > 0) p.shootCd--;
  if (Input.hit('shoot') && p.fire && p.shootCd <= 0 && G.pshots.length < 2) {
    const up = Input.down.up; G.pshots.push({ x: p.x + (p.dir > 0 ? p.w : -6), y: p.y + (up ? 0 : 5), w: 6, h: 6, vx: p.dir * (up ? 3 : 4.2), vy: up ? -6.5 : 1, life: 100 });
    p.shootCd = 12; Sound.sfx('fire');
  }
  // Gefahren: Stacheln & Lava
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 0.01) / T), r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - 0.01) / T);
  for (let rr = r0; rr <= r1; rr++) for (let c = c0; c <= c1; c++) {
    const t = tileAt(c, rr);
    if (t === '^' && p.y + p.h > rr * T + 7) { hurtPlayer(p.x + p.w / 2 - p.vx * 5); p.vy = -5; }
    if (t === '~' && p.y + p.h > rr * T + 5) { fallDamage(true); return; }
  }
  if (p.y > ROWS * T + 24) { fallDamage(false); return; }
  if (p.inv > 0) p.inv--;
  if (p.star > 0) { p.star--; if (p.t % 3 === 0) G.parts.push(part(p.x + rand(0, 10), p.y + rand(0, 15), 0, -0.3, ['#ffe14a', '#ff7ad9', '#7affff'][irand(0, 2)], 20, 2)); if (p.star === 1) Sound.play(G.arena ? 'boss' : th.music); }
  if (p.fire && p.t % 10 === 0) G.parts.push(part(p.x + (p.dir > 0 ? -2 : 10), p.y + 9, -p.dir * 0.3, -0.4, '#ff9a2a', 14, 1));
  if (p.onGround && Math.abs(p.vx) > 0.3) p.runT += Math.abs(p.vx) * 0.12; else p.runT = 0;
  if (ice && Math.abs(p.vx) > 1.8 && p.t % 6 === 0) G.parts.push(part(p.x + 5, p.y + p.h, -p.vx * 0.2, -0.3, '#fff', 14, 1));
}

function hitBlock(c, r) {
  const t = tileAt(c, r), lv = G.lv, x = c * T, y = r * T;
  // Gegner auf dem Block werden weggeschubst
  for (const e of G.enemies) if (!e.dead && e.x + e.w > x && e.x < x + T && Math.abs(e.y + e.h - y) < 3) killEnemy(e, 'bump');
  for (const it of G.items) if (!it.fixed && it.x + it.w > x && it.x < x + T && Math.abs(it.y + it.h - y) < 3) it.vy = -4;
  if (t === 'B') {
    lv.grid[r][c] = ' '; Sound.sfx('brk'); addScore(50);
    for (let i = 0; i < 4; i++) G.parts.push(part(x + 4 + (i % 2) * 8, y + 4 + (i >> 1) * 8, (i % 2 ? 1 : -1) * rand(1, 2), rand(-5, -3), lv.theme.brick, 60, 4, 0.3));
  } else if (t === '?') {
    lv.grid[r][c] = 'U'; lv.bumps.push({ c, r, t: 10 }); Sound.sfx('box');
    G.items.push({ kind: 'coinpop', x: x + 2, y: y - 14, w: 12, h: 12, vy: -5, life: 26 }); addCoin();
  } else if (t === '!' || BOX_ITEMS[t]) {
    lv.grid[r][c] = 'U'; lv.bumps.push({ c, r, t: 10 }); Sound.sfx('box');
    const kind = t === '!' ? powerFor(G.p) : BOX_ITEMS[t];
    G.items.push({ kind, x: x + 2, y: y + 2, boxY: y, w: 12, h: 12, vx: 0, vy: 0, emerge: 18, dir: G.p.x + 5 < x + 8 ? 1 : -1, t: 0 });
  } else { Sound.sfx('bump'); if (t === 'U') lv.bumps.push({ c, r, t: 6 }); }
}

function hurtPlayer(srcX) {
  const p = G.p; if (p.inv > 0 || p.star > 0 || p.dying || G.state !== 'play') return;
  p.hearts--; p.inv = 100; G.hitstop = 5; shake(6); Sound.sfx('hurt');
  p.vx = sign(p.x + p.w / 2 - srcX) * 2.6; p.vy = -3.6; p.ride = null;
  burst(p.x + 5, p.y + 7, ['#ff5a5a', '#fff'], 8, 2);
  if (p.hearts <= 0) killPlayer();
}
function killPlayer() {
  const p = G.p; if (p.dying) return; p.hearts = 0; p.dying = 1; p.vy = -6; p.vx = 0; Sound.stop(); Sound.sfx('die'); G.hitstop = 20;
}
function fallDamage(lava) {
  const p = G.p; if (p.dying) return;
  if (lava) { burst(p.x + 5, p.y + p.h, ['#ff9a2a', '#ffd23f', '#ff5a2a'], 16, 3); Sound.sfx('hurt'); }
  p.hearts--; shake(6);
  if (p.hearts <= 0) { p.dying = 120; Sound.stop(); Sound.sfx('die'); return; }
  Sound.sfx('hurt'); respawnAt(G.checkpoint, false);
}
function respawnAt(cp, full) {
  const p = G.p; p.x = cp.x; p.y = cp.y; p.vx = 0; p.vy = 0; p.inv = 100; p.ride = null; p.dying = 0;
  if (full) { p.hearts = p.maxHearts = 3; p.fire = false; p.wings = false; p.star = 0; }
  updateCamera(true);
}
function afterDeath() {
  G.lives--;
  if (G.lives < 0) { G.state = 'gameover'; G.goT = 0; Sound.stop(); return; }
  startFade(() => { respawnAt(G.checkpoint, true); Sound.play(G.arena ? 'boss' : G.lv.theme.music); });
  G.p.dying = 0; G.p.y = -999; G.p.frozen = true;
}

// ---- Gegner ----
function killEnemy(e, how) {
  if (e.dead) return;
  e.dead = true; e.deadT = 0; e.how = how;
  addScore(e.def.score, e.x, e.y - 6);
  if (how === 'stomp') { Sound.sfx('stomp'); e.vy = 0; e.vx = 0; }
  else { Sound.sfx('kick'); e.vy = -4; e.vx = sign(e.x - G.p.x) * 1.2; burst(e.x + e.w / 2, e.y + e.h / 2, ['#fff', '#ffe14a'], 6, 2); }
}
function updateEnemies() {
  const p = G.p, cx = G.cam.x;
  for (const e of G.enemies) {
    if (e.dead) { e.deadT++; if (e.how !== 'stomp') { e.vy += 0.3; e.x += e.vx; e.y += e.vy; } continue; }
    if (!e.active) { if (e.x < cx + VW + 32 && e.x > cx - 64) e.active = true; else continue; }
    e.t++; if (e.flash) e.flash--;
    e.def.update(e);
    if (e.y > ROWS * T + 40) { e.dead = true; e.deadT = 999; continue; }
    if (p.dying || p.frozen) continue;
    if (overlap(p, e)) {
      if (p.star > 0) { killEnemy(e, 'star'); continue; }
      const fromTop = p.vy > 0 && (p.y + p.h - p.vy) <= e.y + 6;
      if (fromTop && e.def.stomp) { killEnemy(e, 'stomp'); p.vy = Input.down.jump ? -6.4 : -4.2; p.airJumps = p.wings ? 1 : 0; G.hitstop = 2; }
      else hurtPlayer(e.x + e.w / 2);
    }
  }
  G.enemies = G.enemies.filter(e => !(e.dead && e.deadT > 80));
}

// ---- Objekte: Plattformen, Federn, Checkpoints, Rotoren ----
function updateObjs() {
  const p = G.p;
  for (const o of G.objs) {
    if (o.type === 'plat') {
      o.ph += o.sp; const k = (1 - Math.cos(o.ph * Math.PI)) / 2;
      const nx = o.x0 + o.ax * k, ny = o.y0 + o.ay * k; o.dx = nx - o.x; o.dy = ny - o.y; o.x = nx; o.y = ny;
    } else if (o.type === 'spring') {
      if (o.anim > 0) o.anim--;
      if (!p.dying && p.vy > 0 && overlap(p, o) && p.y + p.h - p.vy <= o.y + 6) {
        p.vy = Input.down.jump ? PHYS.spring - 1 : PHYS.spring; p.y = o.y - p.h; o.anim = 12; p.airJumps = p.wings ? 1 : 0; p.coyote = 0; Sound.sfx('spring');
      }
    } else if (o.type === 'check') {
      if (!o.on && overlap(p, o)) { o.on = true; G.checkpoint = { x: o.x + 1, y: o.y + 32 - 15 }; Sound.sfx('check'); burst(o.x + 6, o.y + 4, ['#ffe14a', '#fff', '#7aff7a'], 14, 2.5);
        if (p.hearts < p.maxHearts) p.hearts++; popText(o.x, o.y - 8, 'CHECKPOINT!', '#ffe14a'); }
    } else if (o.type === 'rotor') {
      o.a += o.sp;
      if (!p.dying) for (let i = 1; i <= o.n; i++) {
        const bx = o.x + Math.cos(o.a) * i * 8, by = o.y + Math.sin(o.a) * i * 8;
        if (bx > p.x - 3 && bx < p.x + p.w + 3 && by > p.y - 3 && by < p.y + p.h + 3) { hurtPlayer(bx); break; }
      }
    }
  }
  // Bröckel-Blöcke
  for (const [k, cr] of G.lv.crumbles) {
    cr.t++;
    if (!cr.gone && cr.t > 26) { cr.gone = true; G.lv.grid[cr.r][cr.c] = ' '; Sound.sfx('brk');
      G.parts.push(part(cr.c * T + 8, cr.r * T + 8, 0, 0.5, G.lv.theme.groundLight, 50, 12, 0.25)); }
    if (cr.gone && cr.t > 220) { const px = G.p; const occupied = px.x + px.w > cr.c * T && px.x < cr.c * T + T && px.y + px.h > cr.r * T && px.y < cr.r * T + T;
      if (!occupied) { G.lv.grid[cr.r][cr.c] = 'C'; G.lv.crumbles.delete(k); } }
  }
  for (const b of G.lv.bumps) b.t--; G.lv.bumps = G.lv.bumps.filter(b => b.t > 0);
}

// ---- Items ----
function updateItems() {
  const p = G.p;
  for (const it of G.items) {
    it.t = (it.t || 0) + 1;
    if (it.kind === 'coinpop') { it.vy += 0.35; it.y += it.vy; if (--it.life <= 0) { it.dead = true; burst(it.x + 6, it.y + 6, ['#ffe14a', '#fff'], 5, 1.5); } continue; }
    if (it.emerge > 0) { it.y -= 14 / 18; it.emerge--; continue; }
    if (!it.fixed) {
      const mv = it.kind === 'crystal' ? 'crystal' : (ITEMS[it.kind] || {}).move;
      if (mv === 'walk') { it.vx = it.dir * 0.9; it.vy = Math.min(it.vy + 0.35, 6); const r = moveBody(it); if (r.wall) it.dir *= -1; }
      else if (mv === 'bounce') { it.vx = it.dir * 1.3; it.vy = Math.min(it.vy + 0.3, 6); const r = moveBody(it); if (r.wall) it.dir *= -1; if (it.onGround) it.vy = -4.5; }
      else if (mv === 'float') { it.x += it.dir * 0.5; it.y += Math.sin(it.t * 0.08) * 0.6; if (isSolid(Math.floor((it.x + (it.dir > 0 ? 12 : 0)) / T), Math.floor((it.y + 6) / T))) it.dir *= -1; }
      else if (mv === 'crystal') { it.vy = Math.min((it.vy || 0) + 0.25, 4); moveBody(it); }
      if (it.y > ROWS * T + 20) it.dead = true;
    }
    if (!p.dying && !p.frozen && overlap(p, it)) collectItem(it);
  }
  G.items = G.items.filter(i => !i.dead);
}
function collectItem(it) {
  const p = G.p; it.dead = true;
  if (it.kind === 'coin') { addCoin(); burst(it.x + 6, it.y + 6, ['#ffe14a', '#fff6b0'], 5, 1.2); return; }
  if (it.kind === 'gem') { G.gems[it.idx] = true; G.score += 1000; Sound.sfx('oneup'); burst(it.x + 6, it.y + 6, ['#7affff', '#ff7ad9', '#fff'], 18, 2.5); popText(it.x - 10, it.y - 8, 'EDELSTEIN!', '#7affff'); return; }
  if (it.kind === 'crystal') { levelClear(); return; }
  const def = ITEMS[it.kind]; if (!def) return;
  def.apply(p); G.score += 500; Sound.sfx('power'); burst(it.x + 6, it.y + 6, ['#fff', '#ffe14a'], 12, 2);
  popText(it.x - 20, it.y - 8, def.label, '#ffe14a');
  if (def.hint) G.hint = { s: def.hint, t: 180 };
  if (it.kind === 'star') Sound.play('boss');
}

// ---- Schüsse (Spieler-Feuerbälle & gegnerische Geschosse) ----
function updateShots() {
  const p = G.p;
  for (const s of G.pshots) {
    s.vy = Math.min(s.vy + 0.35, 5); s.life--;
    const r = moveBody(s);
    if (r.ground) s.vy = -3.2;
    if (r.wall || r.ceil || s.life <= 0) { s.dead = true; burst(s.x + 3, s.y + 3, ['#ff9a2a', '#ffd23f'], 5, 1.2); continue; }
    for (const e of G.enemies) if (!e.dead && e.active && e.def.fire && overlap(s, e)) { killEnemy(e, 'fire'); s.dead = true; break; }
    const b = G.boss;
    if (!s.dead && b && !b.dying && overlap(s, b)) { s.dead = true; damageBoss(1, s.x); }
  }
  G.pshots = G.pshots.filter(s => !s.dead && s.x > G.cam.x - 20 && s.x < G.cam.x + VW + 20);
  for (const s of G.shots) {
    s.life--; s.t = (s.t || 0) + 1;
    if (s.warn > 0) { s.warn--; continue; }
    s.vy += s.grav || 0; s.x += s.vx; s.y += s.vy;
    const c = Math.floor((s.x + s.w / 2) / T), r = Math.floor((s.y + s.h) / T);

const SKIN_TONE = '#ffcf9e';
function starSkin(t) { const h = ['#ff5a5a', '#ffd23f', '#7aff7a', '#7affff', '#ff7ad9'], i = Math.floor(t / 4); return { cap: h[i % 5], capDark: h[(i + 1) % 5], capLight: '#fff', shirt: h[(i + 2) % 5], shirtDark: h[(i + 3) % 5], scarf: h[(i + 4) % 5], pants: h[(i + 1) % 5], boot: h[(i + 3) % 5], belt: '#fff', hair: h[i % 5] }; }
function drawHeroSprite(x, y, dir, st, o = {}) {
  let sk = SKINS[st.skin] || SKINS[0]; if (st.star) sk = starSkin(st.t);

    if (st.wings) { const fl = Math.floor(t / 5) % 2; R(0, 7 + fl, 5, 2, '#ffffff'); R(1, 9 + fl, 4, 2, '#d8e8ff'); R(0, 6 + fl * 2, 2, 1, '#ffffff'); }
    // Schal weht hinterher

    else if (st.moving) { b1 = [4, 5, 6, 5][run]; f1 = [10, 9, 8, 9][run]; by = run === 3 ? -1 : 0; fy = run === 1 ? -1 : 0; }
    R(b1, 16 + by, 3, 2, shade(sk.pants, -0.2)); R(b1, 18 + by, 4, 2, shade(sk.boot, -0.15));
    R(f1, 16 + fy, 3, 2, sk.pants); R(f1, 18 + fy, 4, 2, sk.boot);

    else { R(10, 5, 2, 2, '#1a1020'); R(10, 5, 1, 1, '#ffffff'); }
    R(12, 7, 1, 1, '#f08a8a');

}

  const k = f.t < 24 ? 1 - f.t / 24 : (f.t - 24) / 24, r = k * 260;
  ctx.fillStyle = '#0d0a1a'; ctx.beginPath(); ctx.rect(0, 0, VW, VH);
  let cx = f.cx, cy = f.cy; if (G.state === 'play' && G.p && !G.p.frozen) { cx = G.p.x + 5 - G.cam.x; cy = G.p.y + 7; }
  if (r > 0) ctx.arc(cx, cy, r, 0, Math.PI * 2, true); ctx.fill('evenodd');
}

function playLevel(i) {
  Sound.sfx('confirm');
  startFade(() => { G.state = 'play'; G.score = 0; loadLevel(i); });
}

// --- Titel ---
const titleCam = { x: 0 };
function updateTitle() {
  G.t++;
  if (G.bgFor !== 'title') { G.bg = buildBG(THEMES.forest); G.bgFor = 'title'; }
  if (Input.hit('left') || Input.hit('right')) {
    const d = Input.hit('left') ? -1 : 1; let n = G.skinSel;
    for (let k = 0; k < SKINS.length; k++) { n = (n + d + SKINS.length) % SKINS.length; if (totalGems() >= SKINS[n].need) break; }
    G.skinSel = n; SAVE.skin = n; persist(); Sound.sfx('select');
  }
  if (Input.hit('mute')) { SAVE.muted = Sound.toggleMute(); persist(); }
  if (Input.ok() && !G.fade) { Sound.sfx('confirm'); startFade(() => { G.state = 'map'; G.sel = Math.min(SAVE.unlocked - 1, LEVELS.length - 1); G.mapX = null; }); }
  Sound.play('title');
}
function drawTitle() {
  if (G.bgFor !== 'title') { G.bg = buildBG(THEMES.forest); G.bgFor = 'title'; }
  titleCam.x = G.t * 0.6;
  const bg = G.bg; ctx.drawImage(bg.sky, 0, 0, VW, VH);
  for (const L of bg.layers) { const off = -Math.floor((titleCam.x * L.f * 2) % 400); ctx.drawImage(L.c, off, 0); ctx.drawImage(L.c, off + 400, 0); }
  P(ctx, 0, 184, VW, 40, '#8b5a34'); P(ctx, 0, 184, VW, 5, '#3fb83a'); P(ctx, 0, 184, VW, 1, '#93e65a');
  for (let i = 0; i < 30; i++) { const x = ((i * 37 - titleCam.x * 1.2) % 420 + 420) % 420 - 10; P(ctx, x, 194 + (i * 7) % 24, 2, 1, '#5d3a22'); }
  // Logo
  const wob = i => Math.round(Math.sin(G.t * 0.06 + i * 0.5) * 2);
  const title = 'PIXEL KIKO'; const sc = 4, tw = textW(title, sc); let lx = VW / 2 - tw / 2;
  for (let i = 0; i < title.length; i++) { const ch = title[i]; drawStr(ch, lx + i * 6 * sc + 2, 30 + wob(i) + 3, '#140c1c', sc); drawStr(ch, lx + i * 6 * sc, 30 + wob(i), ['#ffe14a', '#ff7a6e', '#7affff', '#93e65a', '#ff7ad9'][i % 5], sc); }
  text('DIE KRISTALL-JAGD', VW / 2, 66, '#fff', 1, 'center');
  // Held
  const sk = G.skinSel;
  drawHeroSprite(VW / 2 - 18, 144, 1, { skin: sk, t: G.t, run: G.t * 0.25, moving: true }, { scale: 2 });
  text('◀ ' + SKINS[sk].name + ' ▶', VW / 2, 120, '#ffe14a', 1, 'center');
  const locked = SKINS.filter(s => totalGems() < s.need).length;
  if (locked) text(locked + ' OUTFITS: SAMMLE EDELSTEINE ◆', VW / 2, 130, '#bde8ff', 1, 'center');
  if (Math.floor(G.t / 30) % 2) text('DRÜCKE ENTER ODER TIPPE', VW / 2, 92, '#fff', 1, 'center');
  P(ctx, 0, VH - 20, VW, 20, 'rgba(20,12,28,0.6)');
  text('PFEILE/WASD LAUFEN  LEER SPRINGEN  X FEUER  P PAUSE  M TON', VW / 2, VH - 13, '#d8d8e8', 1, 'center');
  if (Sound.muted) text('TON AUS', VW - 4, 4, '#ff7a6e', 1, 'right');
}

// --- Weltkarte ---
const MAP_NODES = [[52, 150], [128, 102], [204, 146], [280, 96], [352, 140]];
function updateMap() {
  G.t++; Sound.play('map');
  const total = LEVELS.length + COMING_SOON;
  if (Input.hit('left') && G.sel > 0) { G.sel--; Sound.sfx('select'); }
  if (Input.hit('right') && G.sel < Math.min(SAVE.unlocked - 1, LEVELS.length - 1)) { G.sel++; Sound.sfx('select'); }
  else if (Input.hit('right')) Sound.sfx('bump');
  if (Input.hit('pause')) { startFade(() => { G.state = 'title'; }); }
  if (Input.hit('mute')) { SAVE.muted = Sound.toggleMute(); persist(); }
  const [tx] = MAP_NODES[G.sel]; if (G.mapX == null) G.mapX = tx; G.mapX += (tx - G.mapX) * 0.15;
  if (Input.ok() && !G.fade && G.sel < LEVELS.length && G.sel < SAVE.unlocked) playLevel(G.sel);
  void total;
}
function drawMap() {
  // Meer & Insel
  P(ctx, 0, 0, VW, VH, '#2a5ab0');
  for (let i = 0; i < 40; i++) { const x = (i * 53 + G.t * 0.2) % VW, y = (i * 37) % VH; P(ctx, x, y, 4, 1, '#4a7ad0'); }
  ctx.fillStyle = '#e8d8a0'; ctx.beginPath(); ctx.ellipse(VW / 2, 128, 190, 74, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5ab84a'; ctx.beginPath(); ctx.ellipse(VW / 2, 124, 180, 66, 0, 0, Math.PI * 2); ctx.fill();
  // Gebiete
  const zone = (x, y, col, r) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); };
  zone(52, 146, '#3f9a3a', 34); zone(128, 100, '#5a4a7a', 34); zone(204, 142, '#d8ecff', 34); zone(280, 94, '#6a2a2a', 34); zone(352, 138, '#3a3a4a', 30);
  // Deko
  for (let k = 0; k < 6; k++) { const x = 30 + k * 9, y = 120 + (k % 2) * 8; P(ctx, x, y, 6, 8, '#2a7a2a'); P(ctx, x + 2, y + 8, 2, 3, '#5d3a22'); }
  for (let k = 0; k < 4; k++) { const x = 108 + k * 12, y = 80; P(ctx, x, y, 4, 8, '#c07aff'); P(ctx, x + 1, y, 1, 3, '#fff'); }
  for (let k = 0; k < 3; k++) { const x = 184 + k * 16, y = 116; P(ctx, x, y + 4, 12, 8, '#a8c8e8'); P(ctx, x + 3, y, 6, 4, '#fff'); }
  for (let k = 0; k < 3; k++) { const x = 262 + k * 14, y = 66 + (k % 2) * 4; P(ctx, x, y, 8, 16, '#3a1a1e'); P(ctx, x + 3, y + 4, 2, 3, '#ff9a2a'); }
  // Weg
  for (let i = 0; i < MAP_NODES.length - 1; i++) { const [x1, y1] = MAP_NODES[i], [x2, y2] = MAP_NODES[i + 1];
    for (let k = 1; k < 8; k++) { const x = x1 + (x2 - x1) * k / 8, y = y1 + (y2 - y1) * k / 8; P(ctx, Math.round(x) - 1, Math.round(y) - 1, 3, 3, i + 1 < SAVE.unlocked ? '#fff6d8' : '#8a7a5a'); } }
  // Knoten
  MAP_NODES.forEach(([x, y], i) => {
    const isLevel = i < LEVELS.length, open = isLevel && i < SAVE.unlocked, done = isLevel && i < SAVE.unlocked - 1 || (i === LEVELS.length - 1 && SAVE.beaten);
    P(ctx, x - 9, y - 6, 18, 12, '#140c1c'); P(ctx, x - 8, y - 5, 16, 10, open ? (done ? '#3fe05a' : '#ffd23f') : '#6a6a7a'); P(ctx, x - 8, y - 5, 16, 2, open ? '#fff6b0' : '#8a8a9a');
    text(isLevel ? String(i + 1) : '?', x, y - 3, '#140c1c', 1, 'center', null);
    if (isLevel && !open) { P(ctx, x - 3, y - 13, 6, 5, '#d8dce8'); P(ctx, x - 2, y - 16, 4, 3, '#d8dce8'); P(ctx, x - 1, y - 15, 2, 2, '#6a6a7a'); }
  });
  // Held auf der Karte
  const [, ny] = MAP_NODES[G.sel], bob = Math.floor(G.t / 15) % 2;
  drawHeroSprite(Math.round(G.mapX) - 9, ny - 26 - bob, 1, { skin: G.skinSel, t: G.t, run: 0, moving: false });
  // Info
  P(ctx, 0, 0, VW, 18, 'rgba(20,12,28,0.75)'); text('WELTKARTE', 6, 6, '#ffe14a');
  text('EDELSTEINE ◆ ' + totalGems() + '/' + LEVELS.length * 3, VW - 6, 6, '#7affff', 1, 'right');
  P(ctx, 0, VH - 34, VW, 34, 'rgba(20,12,28,0.8)'); P(ctx, 0, VH - 34, VW, 1, '#ffe14a');
  if (G.sel < LEVELS.length) {
    const L = LEVELS[G.sel], gems = SAVE.gems[G.sel] || [];
    text((G.sel + 1) + '. ' + L.name, 8, VH - 28, '#fff');
    text('BOSS: ' + BOSSES[L.boss].name, 8, VH - 16, '#ffb0ff');
    text([0, 1, 2].map(k => gems[k] ? '◆' : '◇').join(''), VW - 8, VH - 28, '#7affff', 1, 'right');
    if (SAVE.best[G.sel]) text('BEST ' + SAVE.best[G.sel], VW - 8, VH - 16, '#ffe14a', 1, 'right');
  }
  if (Math.floor(G.t / 30) % 2 === 0) text('ENTER = LOS!', VW / 2, VH - 46, '#fff', 1, 'center');
  const [qx, qy] = MAP_NODES[LEVELS.length] || [0, 0];
  if (qx) text('BALD!', qx, qy + 10, '#d8d8e8', 1, 'center');
}

// --- Pause ---
function updatePause() {
  const opts = 2;
  if (Input.hit('up') || Input.hit('left')) { G.sel = (G.sel + opts - 1) % opts; Sound.sfx('select'); }
  if (Input.hit('down') || Input.hit('right')) { G.sel = (G.sel + 1) % opts; Sound.sfx('select'); }
  if (Input.hit('pause')) { G.state = 'play'; return; }
  if (Input.hit('mute')) { SAVE.muted = Sound.toggleMute(); persist(); }
  if (Input.ok()) { if (G.sel === 0) G.state = 'play'; else { Sound.sfx('confirm'); startFade(() => { G.state = 'map'; G.mapX = null; }); G.state = 'pausedOut'; } }
}
function drawPause() {
  P(ctx, 0, 0, VW, VH, 'rgba(13,10,26,0.6)');
  P(ctx, VW / 2 - 80, 60, 160, 90, '#140c1c'); P(ctx, VW / 2 - 78, 62, 156, 86, '#2a1e3e'); P(ctx, VW / 2 - 78, 62, 156, 1, '#ffe14a');
  text('PAUSE', VW / 2, 72, '#ffe14a', 2, 'center');
  ['WEITER', 'ZUR WELTKARTE'].forEach((s, i) => text((G.sel === i ? '▶ ' : '  ') + s, VW / 2 - 50, 100 + i * 14, G.sel === i ? '#fff' : '#9a8aba'));
  text(Sound.muted ? 'M: TON AN' : 'M: TON AUS', VW / 2, 136, '#7a6a9a', 1, 'center');
}

// --- Level geschafft ---
function updateClear() {
  G.clearT++; G.t++;
  const p = G.p; if (G.clearT < 60) { p.vy = Math.min(p.vy + 0.4, 6); moveBody(p); if (p.onGround && G.clearT % 20 === 0) p.vy = -4; p.t++; }
  updateParticles();
  if (G.clearT % 10 === 0 && G.clearT < 80) burst(G.p.x + 5, G.p.y, ['#ffe14a', '#7affff', '#ff7ad9', '#fff'], 8, 3);
  if (G.clearT > 90 && Input.ok() && !G.fade) {
    Sound.sfx('confirm');
    if (G.levelIdx === LEVELS.length - 1) startFade(() => { G.state = 'ending'; G.endT = 0; });
    else startFade(() => { G.state = 'map'; G.sel = Math.min(G.levelIdx + 1, LEVELS.length - 1); G.mapX = null; });
  }
}
function drawClear() {
  if (G.clearT < 50) return;
  const a = Math.min(1, (G.clearT - 50) / 20); ctx.globalAlpha = a;
  P(ctx, VW / 2 - 110, 40, 220, 130, '#140c1c'); P(ctx, VW / 2 - 108, 42, 216, 126, '#2a1e3e'); P(ctx, VW / 2 - 108, 42, 216, 2, '#ffe14a');
  text('LEVEL GESCHAFFT!', VW / 2, 52, '#ffe14a', 2, 'center');
  text('KRISTALL ' + (G.levelIdx + 1) + '/' + LEVELS.length + ' GERETTET', VW / 2, 74, G.lv.theme.crystal, 1, 'center');
  text('MÜNZEN      ' + G.coinsLevel, VW / 2 - 70, 94, '#fff');
  text('EDELSTEINE  ' + [0, 1, 2].map(k => G.gems[k] ? '◆' : '◇').join(''), VW / 2 - 70, 108, '#7affff');
  text('PUNKTE      ' + G.score, VW / 2 - 70, 122, '#fff');
  if (G.clearT > 90 && Math.floor(G.t / 25) % 2) text('ENTER = WEITER', VW / 2, 148, '#fff', 1, 'center');
  ctx.globalAlpha = 1;
}

// --- Game Over ---
function updateGameOver() { G.goT++; if (G.goT > 60 && Input.ok() && !G.fade) startFade(() => { G.state = 'map'; G.mapX = null; }); }
function drawGameOver() {
  P(ctx, 0, 0, VW, VH, '#0d0a1a');
  text('GAME OVER', VW / 2, 80, '#ff5a5a', 3, 'center');
  text('KEINE SORGE - DEIN FORTSCHRITT IST GESPEICHERT', VW / 2, 120, '#d8d8e8', 1, 'center');
  if (G.goT > 60 && Math.floor(G.goT / 25) % 2) text('ENTER = ZUR WELTKARTE', VW / 2, 150, '#fff', 1, 'center');
}

// --- Ende ---
function updateEnding() { G.endT++; G.t++; Sound.play('title'); if (G.endT > 120 && Input.ok() && !G.fade) startFade(() => { G.state = 'title'; }); }
function drawEnding() {
  P(ctx, 0, 0, VW, VH, '#140c2a');
  for (let i = 0; i < 60; i++) { const x = (i * 67) % VW, y = (i * 41) % VH; P(ctx, x, y, 1, 1, (G.t + i * 7) % 60 < 30 ? '#fff' : '#6a5a9a'); }
  text('DU HAST ES GESCHAFFT!', VW / 2, 30, '#ffe14a', 2, 'center');
  const cols = LEVELS.map(l => THEMES[l.theme].crystal);
  cols.forEach((c, i) => { const x = VW / 2 - (cols.length - 1) * 20 + i * 40, y = 70 + Math.round(Math.sin(G.t * 0.08 + i) * 3);
    for (let r = 0; r < 16; r++) { const hw = Math.round(r < 5 ? r + 1 : (16 - r) * 0.5); P(ctx, x - hw, y + r, hw * 2, 1, c); P(ctx, x - hw, y + r, Math.max(1, hw >> 1), 1, '#fff'); } });
  drawHeroSprite(VW / 2 - 18, 100, 1, { skin: G.skinSel, t: G.t, run: 0, moving: false, air: Math.floor(G.t / 20) % 2 === 0 }, { scale: 2 });
  text('ALLE KRISTALLE SIND GERETTET.', VW / 2, 150, '#fff', 1, 'center');
  text('EDELSTEINE: ' + totalGems() + '/' + LEVELS.length * 3 + ' - FINDEST DU ALLE?', VW / 2, 164, '#7affff', 1, 'center');
  text('FORTSETZUNG FOLGT ... WELT 2 IN ARBEIT', VW / 2, 184, '#ff7ad9', 1, 'center');
  if (G.endT > 120 && Math.floor(G.t / 25) % 2) text('ENTER', VW / 2, 204, '#fff', 1, 'center');
}

// ============ 15. HAUPTSCHLEIFE ============
function update() {
  if (Input.hit('mute') && (G.state === 'play')) { SAVE.muted = Sound.toggleMute(); persist(); }
  switch (G.state) {
    case 'title': updateTitle(); break;
    case 'map': updateMap(); break;
    case 'play': if (!G.fade || G.fade.t > 24) updatePlay(); else updateParticles(); if (G.p && G.p.frozen && G.fade && G.fade.t > 24) G.p.frozen = false; break;
    case 'pause': updatePause(); break;
    case 'pausedOut': break;
    case 'clear': updateClear(); break;
    case 'gameover': updateGameOver(); break;
    case 'ending': updateEnding(); break;
  }
  updateFade();
  Input.clear();
}
function draw() {
  ctx.imageSmoothingEnabled = false;
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'map': drawMap(); break;
    case 'play': drawWorld(); break;
    case 'pause': case 'pausedOut': drawWorld(); drawPause(); break;
    case 'clear': drawWorld(); drawClear(); break;
    case 'gameover': drawGameOver(); break;
    case 'ending': drawEnding(); break;
  }
  drawFade();
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; }
  draw(); requestAnimationFrame(frame);
}
function resize() {
  const s = Math.min(innerWidth / VW, innerHeight / VH), sc = s >= 2 ? Math.floor(s) : s;
  cvs.style.width = Math.floor(VW * sc) + 'px'; cvs.style.height = Math.floor(VH * sc) + 'px';
}
addEventListener('resize', resize); resize();
if (matchMedia('(pointer: coarse)').matches) enableTouch();
requestAnimationFrame(frame);

// Entwickler-Hilfe: ?level=2 startet direkt Level 2, &x=150 springt zu Spalte 150 (🔧 zum Testen deiner Levels)
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has('level')) { G.state = 'play'; loadLevel(clamp(+q.get('level') - 1, 0, LEVELS.length - 1));
    if (q.has('x')) { G.p.x = +q.get('x') * T; G.p.y = 120; updateCamera(true); } }
  window.PIXELKIKO = { G, LEVELS, BOSSES, ENEMIES, ITEMS, SKINS, loadLevel, Input, update };
})();
</script>
