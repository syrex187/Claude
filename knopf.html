<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Knopf</title>
<style>
  :root { --bg: #f5f5f7; --text: #1d1d1f; --muted: #86868b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --text: #f5f5f7; --muted: #8e8e93; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #btn {
    width: 220px; height: 220px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #e01b1b 60%, #a30d0d);
    box-shadow: 0 12px 0 #7a0909, 0 20px 40px rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s;
  }
  #btn:active, #btn.pressed {
    transform: translateY(10px);
    box-shadow: 0 2px 0 #7a0909, 0 8px 20px rgba(0,0,0,.25);
  }
  #text { font-size: 1.6rem; font-weight: 700; min-height: 2em; text-align: center; padding: 0 16px; opacity: 0; transition: opacity .2s; }
  #text.show { opacity: 1; }
  #count { color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
  <div id="text">Gabriel, du Vollidiot!</div>
  <button id="btn" aria-label="Drück mich"></button>
  <div id="count">0 Mal gedrückt</div>

<script>
  const btn = document.getElementById("btn");
  const text = document.getElementById("text");
  const count = document.getElementById("count");
  let n = 0, hideTimer;

  function germanVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v => v.lang && v.lang.startsWith("de")) || null;
  }

  btn.addEventListener("click", () => {
    n++;
    count.textContent = n === 1 ? "1 Mal gedrückt" : `${n} Mal gedrückt`;

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Gabriel, du Vollidiot!");
      u.lang = "de-DE";
      const v = germanVoice();
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    text.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => text.classList.remove("show"), 1500);
  });

  if ("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
</body>
</html>
